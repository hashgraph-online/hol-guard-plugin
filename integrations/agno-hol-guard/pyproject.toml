[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agno-hol-guard"
version = "0.1.0"
description = "Fail-closed HOL Guard tool-hook middleware for Agno"
requires-python = ">=3.10"
dependencies = ["agno==2.9.0"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/agno_hol_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
