[build-system]
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "toolhive-hol-guard"
version = "0.1.0"
description = "HOL Guard validating-webhook enforcement for ToolHive MCP gateways"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "hol-guard>=2.2.115",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[project.scripts]
toolhive-hol-guard = "toolhive_hol_guard.server:main"

[project.urls]
Homepage = "https://hol.org/guard"
Repository = "https://github.com/hashgraph-online/hol-guard-plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/toolhive_hol_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
