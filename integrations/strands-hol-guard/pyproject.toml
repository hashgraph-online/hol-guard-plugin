[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "strands-hol-guard"
version = "0.1.0"
description = "Fail-closed HOL Guard InterventionHandler for Strands Agents"
requires-python = ">=3.10"
dependencies = ["strands-agents==1.50.2"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_hol_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
