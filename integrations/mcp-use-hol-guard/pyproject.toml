[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mcp-use-hol-guard"
version = "0.1.0"
description = "Optional HOL Guard pre-tool middleware for mcp-use"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp-use==1.7.0"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_use_hol_guard"]
