name: Publish langchain-hol-guard

on:
  push:
    branches:
      - main
    paths:
      - "integrations/langchain-hol-guard/**"
      - ".github/workflows/publish-langchain-hol-guard.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: publish-langchain-hol-guard
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, publish, and verify
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      STATUS_CONTEXT: pypi/langchain-hol-guard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report publication pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Building and checking PyPI publication\"}" >/dev/null

      - name: Build and validate distribution
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install build twine
          rm -rf "${RUNNER_TEMP}/langchain-hol-guard-dist"
          python3 -m build integrations/langchain-hol-guard --outdir "${RUNNER_TEMP}/langchain-hol-guard-dist"
          python3 -m twine check "${RUNNER_TEMP}/langchain-hol-guard-dist"/*

      - name: Check whether version is already published
        id: pypi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/langchain-hol-guard/json"
          exists = False
          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "hol-guard-plugin-publisher"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              exists = "0.1.0" in payload.get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          print(f"langchain-hol-guard 0.1.0 already published: {exists}")
          PY

      - name: Require configured PyPI publisher
        if: steps.pypi.outputs.exists != 'true' && env.PYPI_API_TOKEN == ''
        run: |
          echo "PYPI_API_TOKEN is not available to this repository; refusing to improvise package publication." >&2
          exit 1

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true' && env.PYPI_API_TOKEN != ''
        run: |
          set -euo pipefail
          python3 -m twine upload \
            --non-interactive \
            --username __token__ \
            --password "${PYPI_API_TOKEN}" \
            "${RUNNER_TEMP}/langchain-hol-guard-dist"/*

      - name: Verify normal installability
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/langchain-hol-guard-pypi-verify"
          source "${RUNNER_TEMP}/langchain-hol-guard-pypi-verify/bin/activate"
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir "langchain-hol-guard==0.1.0"; then
              python - <<'PY'
          from langchain_hol_guard import HolGuardMiddleware
          assert HolGuardMiddleware is not None
          print("langchain-hol-guard 0.1.0 is installable from PyPI")
          PY
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done
          echo "langchain-hol-guard 0.1.0 did not become installable within the verification window." >&2
          exit 1

      - name: Report publication verified
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"PyPI version 0.1.0 install verified\"}" >/dev/null

      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"error\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"PyPI publication or install verification failed\"}" >/dev/null
