name: BeeAI HOL Guard contract

on:
  pull_request:
    paths:
      - 'integrations/beeai-hol-guard/**'
      - '.github/workflows/beeai-hol-guard.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/beeai-hol-guard/**'
      - '.github/workflows/beeai-hol-guard.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install proof and test dependencies
        run: python -m pip install './integrations/beeai-hol-guard[test]'
      - name: Run BeeAI execution contract
        run: python -m pytest -q integrations/beeai-hol-guard/tests
