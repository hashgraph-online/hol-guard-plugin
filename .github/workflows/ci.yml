name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate manifest and assets
        run: npm test

      - name: Scan plugin package
        uses: hashgraph-online/codex-plugin-scanner/action@9533a3340c1e5ea3a3f802d584ec94d9f8580de1
        with:
          plugin_dir: .
          cisco_skill_scan: auto
          min_score: "95"
          fail_on_severity: medium
