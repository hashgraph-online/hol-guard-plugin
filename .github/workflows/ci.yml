name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate manifests, assets, and DSH gate
        run: npm test

      - name: Install pinned DSH test runtime
        run: |
          npm install --global pnpm@11.17.0
          npm install --no-save --package-lock=false @deepseek-ai/dsh@0.1.0-rc.5

      - name: Run real DSH headless integration
        run: npm run test:dsh-e2e

      - name: Install Codex Plugin Scanner
        run: python3 -m pip install --user "codex-plugin-scanner[cisco]==2.0.12"

      - name: Scan plugin package
        run: |
          codex-plugin-scanner scan . \
            --format json \
            --cisco-skill-scan auto \
            --min-score 95 \
            --fail-on-severity medium
