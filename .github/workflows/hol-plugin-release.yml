name: HOL Plugin Release

# Scans each published release with HOL Guard, checks it with the Plugin Kit,
# attests the evidence on GitHub and records it on the plugin's HOL listing.
# Releases cut by publish-agent-skills.yml are attested there, because a
# release created with the workflow token does not trigger this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: hashgraph-online/hol-guard/.github/workflows/plugin-release.yml@cf47a7bfefb1087c5c58ae78f210b43e255e857a
    with:
      plugin_dir: "."
      fail_on_severity: critical
      upload_sarif: false
      visibility: public
