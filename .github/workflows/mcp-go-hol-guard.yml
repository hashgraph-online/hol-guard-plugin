name: mcp-go HOL Guard integration

on:
  pull_request:
    paths:
      - 'integrations/mcp-go-hol-guard/**'
      - '.github/workflows/mcp-go-hol-guard.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/mcp-go-hol-guard/**'
      - '.github/workflows/mcp-go-hol-guard.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: integrations/mcp-go-hol-guard/go.mod
      - name: Resolve pinned dependencies
        working-directory: integrations/mcp-go-hol-guard
        run: go mod tidy
      - name: Run mcp-go policy middleware contract tests
        working-directory: integrations/mcp-go-hol-guard
        run: go test -v ./...
