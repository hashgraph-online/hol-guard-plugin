name: ConnectOnion HOL Guard contract

on:
  pull_request:
    paths:
      - "integrations/connectonion-hol-guard/**"
      - ".github/workflows/connectonion-hol-guard.yml"
  push:
    branches: [main]
    paths:
      - "integrations/connectonion-hol-guard/**"
      - ".github/workflows/connectonion-hol-guard.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pinned ConnectOnion source
        env:
          CONNECTONION_COMMIT: 8f8638373899c1929e8a7217c0f839dc02b463f2
          CONNECTONION_SOURCE: ${{ runner.temp }}/connectonion
        run: |
          git clone --filter=blob:none https://github.com/openonion/connectonion.git "$CONNECTONION_SOURCE"
          git -C "$CONNECTONION_SOURCE" checkout --detach "$CONNECTONION_COMMIT"
          python -m pip install --upgrade pip
          python -m pip install -e "$CONNECTONION_SOURCE" pytest

      - name: Verify upstream execution boundary
        env:
          CONNECTONION_SOURCE: ${{ runner.temp }}/connectonion
        run: |
          grep -q "agent._invoke_events('before_each_tool')" "$CONNECTONION_SOURCE/connectonion/core/tool_executor.py"
          grep -q "Raise an exception to cancel the tool execution" "$CONNECTONION_SOURCE/connectonion/core/events.py"

      - name: Run installed-framework contract tests
        env:
          PYTHONPATH: integrations/connectonion-hol-guard
        run: pytest -q integrations/connectonion-hol-guard/tests
