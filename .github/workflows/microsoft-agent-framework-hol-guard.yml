name: Microsoft Agent Framework HOL Guard integration

on:
  pull_request:
    paths:
      - "integrations/microsoft-agent-framework-hol-guard/**"
      - ".github/workflows/microsoft-agent-framework-hol-guard.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/microsoft-agent-framework-hol-guard/**"
      - ".github/workflows/microsoft-agent-framework-hol-guard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install integration
        run: python -m pip install -e 'integrations/microsoft-agent-framework-hol-guard[test]'

      - name: Verify fail-closed FunctionMiddleware contract
        run: pytest integrations/microsoft-agent-framework-hol-guard/tests -q
