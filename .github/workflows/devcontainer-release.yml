name: Publish Dev Container Feature

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/devcontainer-release.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish HOL Guard feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Publish feature to GHCR
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
