name: Agno HOL Guard integration

on:
  pull_request:
    paths:
      - "integrations/agno-hol-guard/**"
      - ".github/workflows/agno-hol-guard.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/agno-hol-guard/**"
      - ".github/workflows/agno-hol-guard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install integration
        run: python -m pip install -e 'integrations/agno-hol-guard[test]'

      - name: Verify Agno tool-hook execution contract
        run: |
          set -o pipefail
          pytest integrations/agno-hol-guard/tests -q 2>&1 | tee "${RUNNER_TEMP}/agno-contract.log"

      - name: Upload Agno contract diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agno-contract-diagnostics
          path: ${{ runner.temp }}/agno-contract.log
          if-no-files-found: error
          retention-days: 3
