name: Agno HOL Guard integration

on:
  pull_request:
    paths:
      - "integrations/agno-hol-guard/**"
      - ".github/workflows/agno-hol-guard.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/agno-hol-guard/**"
      - ".github/workflows/agno-hol-guard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install integration
        run: python -m pip install -e 'integrations/agno-hol-guard[test]'

      - name: Verify Agno tool-hook execution contract
        run: pytest integrations/agno-hol-guard/tests -q
