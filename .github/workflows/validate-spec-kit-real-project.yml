name: Validate Spec Kit Real Project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-spec-kit-real-project.yml"
      - "tests/validate-spec-kit.mjs"
      - "scripts/sync-hol-guard-runtime-version.mjs"
      - "distributions/wshobson-agents/**"
  release:
    types:
      - published
  workflow_run:
    workflows:
      - "Publish Agent Skills"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-spec-kit-real-project-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exercise released extension in a real Spec Kit project
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Validate manifest and shared version
        run: node tests/validate-spec-kit.mjs

      - name: Resolve reviewed HOL CLI version
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import { inspectHolGuardRuntimePins } from './scripts/sync-hol-guard-runtime-version.mjs'; console.log((await inspectHolGuardRuntimePins(process.cwd())).version)")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid reviewed HOL CLI version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pinned Spec Kit CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check \
            "git+https://github.com/github/spec-kit.git@ead30d9cfb99c07b3073afa73e7b40a64015f17f"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install reviewed HOL Guard and scanner CLIs
        env:
          HOL_CLI_VERSION: ${{ steps.cli.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # HOL Guard and plugin-scanner intentionally publish as separate PyPI
          # distributions even though they share source and a release version.
          pipx install --force "hol-guard==${HOL_CLI_VERSION}"
          pipx install --force "plugin-scanner==${HOL_CLI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:/opt/pipx_bin:$PATH"
          command -v hol-guard
          command -v plugin-scanner
          hol-guard --version
          plugin-scanner --version

      - name: Resolve exact released archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"
          PACKAGE_PATHS=(extension.yml commands README.md LICENSE)

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          git fetch --force --tags origin
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if [[ ! "$TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve commit for $TAG." >&2
            exit 1
          fi

          CURRENT_PACKAGE_DIGEST="$(git ls-tree -r HEAD -- "${PACKAGE_PATHS[@]}" | sha256sum | awk '{print $1}')"
          TAG_PACKAGE_DIGEST="$(git ls-tree -r "$TAG_COMMIT" -- "${PACKAGE_PATHS[@]}" | sha256sum | awk '{print $1}')"
          if [[ "$TAG_PACKAGE_DIGEST" != "$CURRENT_PACKAGE_DIGEST" ]]; then
            echo "$TAG does not contain the current Spec Kit package. Publish a coherent release before validating catalog readiness." >&2
            exit 1
          fi

          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${TAG_COMMIT}.zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "archive_url=$ARCHIVE_URL" >> "$GITHUB_OUTPUT"

      - name: Install and exercise extension in a real project
        env:
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.tag_commit }}
          HOL_CLI_VERSION: ${{ steps.cli.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/opt/pipx_bin:$PATH"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"

          # Use a supported command-backed integration while bypassing the
          # external agent binary check so this tests Spec Kit itself.
          specify init --here --force --non-interactive --ignore-agent-tools \
            --integration gemini

          printf 'y\n' | specify extension add hol-guard --from "$ARCHIVE_URL"
          specify extension list | tee installed-extensions.txt
          grep -F "hol-guard" installed-extensions.txt

          # Re-activation is the documented rescaffold path for all enabled
          # extension commands and proves the installed package is repeatable.
          specify integration use gemini

          specify integration status --json > integration-status.json
          cat integration-status.json
          python3 <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("integration-status.json").read_text(encoding="utf-8"))
          status = payload.get("status")
          if status not in {"ok", "warning"}:
              raise SystemExit(f"Spec Kit integration status is not healthy: {status!r}")
          print(f"Spec Kit integration status={status}")
          PY

          echo "Registered project files:"
          for root in .gemini .specify; do
            if [[ -e "$root" ]]; then
              find "$root" -maxdepth 5 -type f -print
            else
              echo "MISSING_ROOT $root"
            fi
          done | sort

          COMMAND_ROOT=".gemini/commands"
          if [[ ! -d "$COMMAND_ROOT" ]]; then
            echo "Gemini command directory was not created." >&2
            exit 1
          fi

          mapfile -t PROTECT_COMMANDS < <(
            grep -rlF "hol-guard status" "$COMMAND_ROOT"
          )
          mapfile -t SCAN_COMMANDS < <(
            grep -rlF "plugin-scanner lint" "$COMMAND_ROOT"
          )

          if [[ "${#PROTECT_COMMANDS[@]}" -ne 1 ]]; then
            printf 'Expected exactly one rendered protect command, found %s\n' "${#PROTECT_COMMANDS[@]}" >&2
            printf '%s\n' "${PROTECT_COMMANDS[@]:-}" >&2
            exit 1
          fi
          if [[ "${#SCAN_COMMANDS[@]}" -ne 1 ]]; then
            printf 'Expected exactly one rendered scan command, found %s\n' "${#SCAN_COMMANDS[@]}" >&2
            printf '%s\n' "${SCAN_COMMANDS[@]:-}" >&2
            exit 1
          fi

          PROTECT_COMMAND="${PROTECT_COMMANDS[0]}"
          SCAN_COMMAND="${SCAN_COMMANDS[0]}"
          echo "Protect command: $PROTECT_COMMAND"
          echo "Scan command: $SCAN_COMMAND"

          grep -F "hol-guard status" "$PROTECT_COMMAND"
          grep -F "hol-guard detect --json" "$PROTECT_COMMAND"
          grep -F "plugin-scanner lint" "$SCAN_COMMAND"
          grep -F "plugin-scanner verify" "$SCAN_COMMAND"

          # Exercise the non-mutating path documented by the protect command.
          # The command deliberately requires explicit user intent before any
          # harness installation, so CI must not run `hol-guard install ...`.
          hol-guard status | tee hol-guard-status.txt
          hol-guard detect --json | tee hol-guard-detect.json

          # Exercise both scanner operations against the exact installed
          # extension package.
          SCAN_TARGET=".specify/extensions/hol-guard"
          test -f "$SCAN_TARGET/skills/plugin-scanner/SKILL.md"
          plugin-scanner lint "$SCAN_TARGET" | tee plugin-scanner-lint.txt
          plugin-scanner verify "$SCAN_TARGET" | tee plugin-scanner-verify.txt

          {
            echo "## HOL Guard Spec Kit real-project validation"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Immutable release commit: \`$RELEASE_COMMIT\`"
            echo "- Reviewed HOL CLI version: \`$HOL_CLI_VERSION\`"
            echo "- Integration: Gemini command-backed real project"
            echo "- Rendered protect command: \`$PROTECT_COMMAND\`"
            echo "- Rendered scan command: \`$SCAN_COMMAND\`"
            echo "- Protect recipe exercised: \`hol-guard status\`, \`hol-guard detect --json\`"
            echo "- Scan recipe exercised against installed extension root: \`plugin-scanner lint\`, \`plugin-scanner verify\`"
            echo "- Mutating harness installation intentionally skipped because the command requires explicit user intent."
          } >> "$GITHUB_STEP_SUMMARY"
